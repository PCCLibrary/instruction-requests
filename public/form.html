<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1>Create Event</h1>
    <form id="eventForm">
        <div class="mb-3">
            <label for="name" class="form-label">Event Name</label>
            <input type="text" class="form-control" id="name" name="name" value="IRW 115 Sutherland - ACV">
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description">Sylvania Lib120</textarea>
        </div>
        <div class="mb-3">
            <label for="startDateTime" class="form-label">Start Date/Time</label>
            <input type="datetime-local" class="form-control" id="startDateTime" name="startDateTime" value="">
        </div>
        <div class="mb-3">
            <label for="endDateTime" class="form-label">End Date/Time</label>
            <input type="datetime-local" class="form-control" id="endDateTime" name="endDateTime" value="">
        </div>

        <div class="mb-3">
            <label>Attendees</label>
            <div id="attendeesContainer">
                <div class="attendee-row">
                    <div class="row">
                        <div class="col-md-3">
                            <label for="attendees[0][email]" class="form-label">Instructor Email</label>
                            <input type="email" class="form-control" id="attendees[0][email]" name="attendees[0][email]" placeholder="Email" value="john@example.com">
                        </div>
                        <div class="col-md-3">
                            <label for="attendees[0][name]" class="form-label">Instructor Name</label>
                            <input type="text" class="form-control" id="attendees[0][name]" name="attendees[0][name]" placeholder="Name" value="John Doe">
                        </div>
                    </div>
                </div>
                <div class="attendee-row">
                    <div class="row">
                        <div class="col-md-3">
                            <label for="attendees[1][email]" class="form-label">Librarian Email</label>
                            <input type="email" class="form-control" id="attendees[1][email]" name="attendees[1][email]" placeholder="Email" value="anotherEmail@gmail.com">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="mb-3">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="addMeetLink" name="addMeetLink" checked>
                <label class="form-check-label" for="addMeetLink">
                    Add Google Meet Link
                </label>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const now = new Date();
        const startDateTimeInput = document.getElementById('startDateTime');
        const endDateTimeInput = document.getElementById('endDateTime');

        const nowISO = now.toISOString().slice(0, 16);
        startDateTimeInput.value = nowISO;

        const oneHourLater = new Date(now.getTime() + 60 * 60 * 1000);
        const oneHourLaterISO = oneHourLater.toISOString().slice(0, 16);
        endDateTimeInput.value = oneHourLaterISO;
    });
</script>
</body>
</html>
